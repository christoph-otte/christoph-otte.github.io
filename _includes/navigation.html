<header class="no-print">
      <!--<h1 class="logo">{{ site.title }}</h1>-->
      <nav role="navigation" aria-label="Main navigation">
{% assign on_tag_page = false %}{% if page.url contains '/tag/' %}{% assign on_tag_page = true %}{% endif %}
<ul>
   {% for item in site.data.navigation.links %}
      <li><a href="{{ item.url }}" data-text="{{ item.title }}" {% if item.url == page.url %}class="active"{% elsif item.url == '/writing' and page.collection == 'posts' %}class="active"{% elsif item.url == '/tags' and on_tag_page %}class="active"{% endif %}>{{ item.title }}</a></li>
   {% endfor %}
   <li class="nav-icon"><a href="{{ site.baseurl }}/atom.xml" aria-label="RSS Feed"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="14" height="14"><circle cx="3.5" cy="12.5" r="1" fill="currentColor" stroke="none"/><path d="M3.5 8.5a4 4 0 0 1 4 4"/><path d="M3.5 4.5a8 8 0 0 1 8 8"/></svg></a></li>
</ul>
</nav>
</header>
