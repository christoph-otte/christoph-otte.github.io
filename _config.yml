url: https://bernerbruno.github.io
title: Christoph's homepage
description: My first steps towards publishing my own website on Github Pages!
twitter:
  username: bernerbruno
  card: summary
  creator: bernerbruno
author:
  twitter: bernerbruno
  name: Christoph
  avatar:
  email: christoph.otte@icloud.com
  url: https://phoebe.pubpub.org
permalink: pretty

baseurl: ""

highlighter: none

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - .jekyll-cache
  
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir:          _sass
  style:            :compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:slug
  
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"